# VMware Policy — shipped baseline
#
# This file is LOADED AUTOMATICALLY when you have no ~/.vmware/rules.yaml.
# Write your own to take full control — a user file replaces this one entirely
# and is never merged with it.
#
# Check which rules are actually in force:
#     vmware-audit policy
#
# Rule evaluation order:
#   1. deny rules            (if any match → operation blocked)
#   2. maintenance_window    (high/critical ops restricted to the window)
#   3. default               → allow
#
# WHAT THIS BASELINE DOES
# -----------------------
# NOTHING IS BLOCKED BY DEFAULT. The skill ships full read+write; whether an
# agent can actually change anything is decided by the privilege of the vCenter/
# NSX account it is given (RBAC), not by this file. To run an agent read-only,
# give it a read-only service account — enforced at the platform, un-bypassable.
#
# This file exists so you can add your OWN deny rules and maintenance window if
# you want skill-side guardrails on top of RBAC. Both are opt-in and off here.
# (Approval tiers and the "declare an environment or be refused" gate were
# removed in v1.8.7 — see the VMware-Policy security HLD.)

# ── Deny rules ────────────────────────────────────────────────────────
# Nothing is denied by default — denial is a policy decision only you can make
# for your estate. The optional `environments:` list scopes a rule to targets
# that declare a matching `environment:` label in the skill's config.yaml; a
# target with no label is simply not matched. Uncomment and adapt:
#
# deny:
#   - name: no-delete-in-prod
#     operations: ["delete_*", "*_delete", "cluster_delete"]
#     environments: ["production", "prod"]
#     reason: "Destructive operations are not allowed in production"
#
#   - name: no-critical-outside-window
#     min_risk_level: critical
#     environments: ["production", "prod"]
#     reason: "Critical operations require a maintenance window"

# ── Maintenance window ────────────────────────────────────────────────
# Restricts high/critical operations to a time range. Off by default.
#
# maintenance_window:
#   start: "22:00"
#   end: "06:00"

# ── Change limits (reserved, NOT enforced) ────────────────────────────
# Parsed but not enforced: the engine has no before-state to compute deltas
# against, so configuring this only emits a "NOT enforced" warning.
#
# change_limits:
#   max_cpu_change_pct: 20
#   max_memory_change_pct: 50
